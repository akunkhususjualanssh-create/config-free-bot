[unix_http_server]
file=/opt/config-free/run/supervisor.sock
chmod=0600

[supervisord]
logfile=/opt/config-free/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/opt/config-free/run/supervisord.pid
childlogdir=/opt/config-free/logs
user=configfree
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///opt/config-free/run/supervisor.sock

[program:config-free]
command=/opt/config-free/.venv/bin/python /opt/config-free/bot.py
directory=/opt/config-free
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/opt/config-free/logs/bot.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
